# nginx config for grainbites.geeb.us
# Copy to /etc/nginx/sites-available/grainbites.geeb.us and symlink into sites-enabled.
#
# First deploy (before a cert exists), comment out the second server block
# and drop the `return 301` from the port-80 block so certbot's webroot
# check can reach it over plain HTTP:
#   certbot certonly --webroot -w /var/www/html/grainbites -d grainbites.geeb.us

server {
    listen 80;
    server_name grainbites.geeb.us;

    root /var/www/html/grainbites;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name grainbites.geeb.us;

    ssl_certificate /etc/letsencrypt/live/grainbites.geeb.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grainbites.geeb.us/privkey.pem;

    root /home/gee/grain-bites/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
